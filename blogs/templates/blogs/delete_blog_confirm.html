<!DOCTYPE html>
<html>
  <head>
    <title>Delete Blog - {{ blog.title }}</title>
  </head>
  <body>
    <h1>Are you sure you want to delete this blog?</h1>
    <p><strong>{{ blog.title }}</strong></p>

    <form method="POST">
      {% csrf_token %}
      <button type="submit">Yes, Delete</button>
      <a href="{% url 'blog_detail' blog.slug %}">Cancel</a>
    </form>
  </body>
</html>
